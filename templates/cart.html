<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart – E‑Commerce</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="neu-icon">
                    <div class="icon-inner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"/>
                            <circle cx="20" cy="21" r="1"/>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                        </svg>
                    </div>
                </div>
                <h2>Your Cart</h2>
                <p>Review your items and proceed to checkout</p>
            </div>

            <!-- Loading State -->
            <div id="loadingContainer" style="text-align: center; padding: 20px;">
                <p style="color: #9499b7; font-size: 14px;">Loading cart...</p>
            </div>

            <!-- Cart Items Container -->
            <div id="cartItemsContainer" class="success-details" style="max-height: 350px; overflow: auto; margin-bottom: 20px; display: none;">
            </div>

            <!-- Empty Cart Message -->
            <div class="success-message" id="emptyMessage" style="display: none;">
                <div class="success-icon neu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <circle cx="9" cy="21" r="1"/>
                        <circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                </div>
                <h3>Your Cart is Empty</h3>
                <p class="success-subtitle">Add some products to get started!</p>
                <a href="/shop" class="neu-button" style="width: auto; padding: 10px 24px; margin-top: 16px; text-decoration: none; display: inline-block;">
                    <span class="btn-text">Browse Products</span>
                </a>
            </div>

            <!-- Error Message -->
            <div class="success-message" id="errorMessage" style="display: none;">
                <div class="success-icon neu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="7" x2="12" y2="13" />
                        <circle cx="12" cy="17" r="1" />
                    </svg>
                </div>
                <h3>Something went wrong</h3>
                <p class="success-subtitle" id="errorText">Failed to load cart.</p>
            </div>

            <!-- Total and Checkout Section -->
            <div id="checkoutSection" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(148, 153, 183, 0.2);">
                <div class="success-details" style="margin-bottom: 20px;">
                    <div class="success-row">
                        <span class="label" style="font-size: 18px; font-weight: 600;">Total</span>
                        <span class="value" id="cartTotal" style="font-size: 20px; font-weight: 700; color: #3d4468;">$0.00</span>
                    </div>
                </div>

                <button id="checkoutBtn" class="neu-button signup-btn" style="width: 100%;">
                    <span class="btn-text">Proceed to Payment</span>
                    <div class="btn-loader">
                        <div class="neu-spinner"></div>
                    </div>
                </button>

                <div class="success-message" id="checkoutMessage" style="display: none; margin-top: 16px;">
                    <div class="success-icon neu-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </div>
                    <h3 id="checkoutMessageTitle">Processing...</h3>
                    <p class="success-subtitle" id="checkoutMessageText"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/sign-in';
        }

        const loadingContainer = document.getElementById('loadingContainer');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const emptyMessage = document.getElementById('emptyMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const checkoutSection = document.getElementById('checkoutSection');
        const cartTotal = document.getElementById('cartTotal');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const checkoutMessage = document.getElementById('checkoutMessage');
        const checkoutMessageTitle = document.getElementById('checkoutMessageTitle');
        const checkoutMessageText = document.getElementById('checkoutMessageText');

        function createCartItemCard(item) {
            const itemID = item.ID || item.id;
            const product = item.Product || item.product || {};
            const title = product.Title || product.title || 'Unknown Product';
            const quantity = item.Quantity || item.quantity || 0;
            const unitPrice = item.UnitPrice || item.unit_price || 0;
            const lineTotal = quantity * unitPrice;

            const card = document.createElement('div');
            card.style.padding = '16px 20px';
            card.style.marginBottom = '12px';
            card.style.borderRadius = '16px';
            card.style.background = '#e0e5ec';
            card.style.boxShadow = 'inset 4px 4px 10px #bec3cf, inset -4px -4px 10px #ffffff';

            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                    <div style="flex: 1;">
                        <div style="font-weight: 600; color: #3d4468; font-size: 16px; margin-bottom: 4px;">${title}</div>
                        <div style="font-size: 12px; color: #9499b7;">
                            <span>Quantity: ${quantity}</span>
                            <span style="margin-left: 12px;">@ $${Number(unitPrice).toFixed(2)}</span>
                        </div>
                    </div>
                    <div style="font-weight: 700; color: #3d4468; font-size: 18px;">
                        $${Number(lineTotal).toFixed(2)}
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
                    <button class="neu-button remove-btn" data-item-id="${itemID}" style="width: auto; padding: 8px 16px; margin-bottom: 0; font-size: 12px; background: #ffe0e6;">
                        <span class="btn-text">Remove</span>
                    </button>
                </div>
            `;

            // Add click handler for remove button
            const removeBtn = card.querySelector('.remove-btn');
            removeBtn.addEventListener('click', async () => {
                if (confirm(`Are you sure you want to remove "${title}" from your cart?`)) {
                    await removeCartItem(itemID);
                }
            });

            return card;
        }

        async function removeCartItem(itemID) {
            try {
                const res = await fetch(`/api/cart/remove/${itemID}`, {
                    method: 'DELETE',
                    headers: { Authorization: 'Bearer ' + token },
                });
                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Failed to remove item from cart');
                    return;
                }

                // Reload cart to reflect changes
                await loadCart();
            } catch (err) {
                console.error(err);
                alert('Network error. Please try again.');
            }
        }

        async function loadCart() {
            loadingContainer.style.display = 'block';
            cartItemsContainer.style.display = 'none';
            emptyMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            checkoutSection.style.display = 'none';
            checkoutMessage.style.display = 'none';
            cartItemsContainer.innerHTML = '';

            try {
                const res = await fetch('/cart', {
                    headers: { Authorization: 'Bearer ' + token },
                });
                const data = await res.json();

                loadingContainer.style.display = 'none';

                if (!res.ok) {
                    errorText.textContent = data.error || 'Failed to load cart';
                    errorMessage.style.display = 'block';
                    return;
                }

                const cart = data.cart;
                const total = data.total || 0;

                if (!cart || !Array.isArray(cart.Items) || cart.Items.length === 0) {
                    emptyMessage.style.display = 'block';
                    return;
                }

                // Display cart items
                cart.Items.forEach((item) => {
                    cartItemsContainer.appendChild(createCartItemCard(item));
                });

                cartItemsContainer.style.display = 'block';
                cartTotal.textContent = '$' + total.toFixed(2);
                checkoutSection.style.display = 'block';
            } catch (err) {
                console.error(err);
                loadingContainer.style.display = 'none';
                errorText.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'block';
            }
        }

        checkoutBtn.addEventListener('click', () => {
            // Redirect to payment page
            window.location.href = '/pay';
        });

        loadCart();
    </script>
</body>
</html>
