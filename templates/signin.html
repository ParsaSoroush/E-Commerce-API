<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphism Sign In Form</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="neu-icon">
                    <div class="icon-inner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                </div>
                <h2>Sign In</h2>
                <p>Enter your credentials to login</p>
            </div>

            <form id="signInForm" method="POST">
                <div class="form-group">
                    <div class="input-group neu-input">
                        <input type="text" id="username" name="username" required autocomplete="username" placeholder=" ">
                        <label for="username">Username</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                    </div>
                    <span class="error-message" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <div class="input-group neu-input password-group">
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder=" ">
                        <label for="password">Password</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </div>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="neu-button signup-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="btn-loader">
                        <div class="neu-spinner"></div>
                    </div>
                </button>
            </form>

            <div class="success-message" id="successMessage">
                <div class="success-icon neu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
                <h3>Success!</h3>
                <p class="success-subtitle">You are logged in.</p>

                <div class="success-details">
                    <div class="success-row">
                        <span class="label">Username</span>
                        <span class="value" id="successUsername">—</span>
                    </div>
                    <div class="success-row">
                        <span class="label">Token</span>
                        <span class="value token-value" id="successToken">—</span>
                    </div>
                </div>
                <button type="button" id="redirectButton" class="neu-button" style="display: none; margin-top: 20px;">
                    <span class="btn-text">Continue</span>
                </button>
            </div>

        </div>
    </div>
    <script>
      const form = document.getElementById("signInForm");
      const successMessage = document.getElementById("successMessage");
      const usernameError = document.getElementById("usernameError");
      const passwordError = document.getElementById("passwordError");
      
      form.addEventListener("submit", async (e) => {
          e.preventDefault();
          usernameError.textContent = "";
          usernameError.classList.remove("show");
          passwordError.textContent = "";
          passwordError.classList.remove("show");
          successMessage.classList.remove("show");
          document.getElementById("redirectButton").style.display = "none";
      
          const data = {
              username: form.username.value.trim(),
              password: form.password.value.trim()
          };
      
          try {
              const res = await fetch("/sign-in", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(data)
              });
      
              const result = await res.json();
      
              if (res.ok) {
                  document.getElementById("successUsername").textContent = result.user?.username || data.username;
                  document.getElementById("successToken").textContent = result.token || "Generated";
                  if (result.token) {
                      try {
                          localStorage.setItem('token', result.token);
                      } catch (e) {
                          console.error("Failed to store token", e);
                      }
                  }
                  successMessage.classList.add("show");
                  form.reset();
                  
                  // Show redirect button based on admin status
                  const redirectButton = document.getElementById("redirectButton");
                  const isAdmin = result.user?.is_admin || false;
                  redirectButton.style.display = "block";
                  redirectButton.onclick = () => {
                      window.location.href = isAdmin ? "/products" : "/shop";
                  };
              } else {
                  if (result.error?.includes("username")) {
                      usernameError.textContent = result.error;
                      usernameError.classList.add("show");
                  } else {
                      passwordError.textContent = result.error || "Incorrect username or password.";
                      passwordError.classList.add("show");
                  }
              }
          } catch (err) {
              console.error(err);
              passwordError.textContent = "Something went wrong. Try again.";
              passwordError.classList.add("show");
          }
      });
      </script>
</body>
</html>
