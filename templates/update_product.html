<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Product</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="neu-icon">
                    <div class="icon-inner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </div>
                </div>
                <h2>Update Product</h2>
                <p>Modify product details</p>
            </div>

            <!-- Token Input Form -->
            <form id="tokenForm">
                <div class="form-group">
                    <div class="input-group neu-input">
                        <input type="text" id="adminToken" name="token" required placeholder=" ">
                        <label for="adminToken">Admin JWT Token</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="5" width="18" height="14" rx="2" ry="2" />
                                <path d="M7 9h10M7 13h6" />
                            </svg>
                        </div>
                    </div>
                    <span class="error-message" id="tokenError"></span>
                </div>

                <button type="submit" class="neu-button signup-btn">
                    <span class="btn-text">Verify Token</span>
                    <div class="btn-loader">
                        <div class="neu-spinner"></div>
                    </div>
                </button>
            </form>

            <!-- Update Product Form (shown after token verification) -->
            <form id="updateProductForm" style="display: none;">
                <div class="form-group">
                    <div class="input-group neu-input">
                        <input type="text" id="title" name="title" required placeholder=" ">
                        <label for="title">Product Title</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 6h16M4 12h16M4 18h10" />
                            </svg>
                        </div>
                    </div>
                    <span class="error-message" id="titleError"></span>
                </div>

                <div class="form-group">
                    <div class="input-group neu-input">
                        <input type="number" step="0.01" min="0" id="price" name="price" required placeholder=" ">
                        <label for="price">Price (USD)</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 1v22M8 5h4a3 3 0 0 1 0 6H10a3 3 0 0 0 0 6h6" />
                            </svg>
                        </div>
                    </div>
                    <span class="error-message" id="priceError"></span>
                </div>

                <div class="form-group">
                    <div class="input-group neu-input">
                        <input type="number" min="0" step="1" id="stock" name="stock" required placeholder=" ">
                        <label for="stock">Stock Quantity</label>
                        <div class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="4" rx="1" />
                                <rect x="3" y="10" width="18" height="4" rx="1" />
                                <rect x="3" y="16" width="18" height="4" rx="1" />
                            </svg>
                        </div>
                    </div>
                    <span class="error-message" id="stockError"></span>
                </div>

                <button type="submit" class="neu-button signup-btn">
                    <span class="btn-text">Update Product</span>
                    <div class="btn-loader">
                        <div class="neu-spinner"></div>
                    </div>
                </button>
            </form>

            <!-- Success Message -->
            <div class="success-message" id="successMessage" style="display: none;">
                <div class="success-icon neu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
                <h3>Product Updated!</h3>
                <p class="success-subtitle">Redirecting to products page...</p>
            </div>

            <!-- Access Denied Message -->
            <div class="success-message" id="forbiddenMessage" style="display: none;">
                <div class="success-icon neu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="7" x2="12" y2="13" />
                        <circle cx="12" cy="17" r="1" />
                    </svg>
                </div>
                <h3>Access Denied</h3>
                <p class="success-subtitle">Only admin users can update products.</p>
                <p style="color: #9499b7; font-size: 14px; margin-top: 12px;">
                    Redirecting to public products page...
                </p>
            </div>

            <!-- Loading Message -->
            <div class="success-message" id="loadingMessage" style="display: none;">
                <div class="success-icon neu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" stroke-dasharray="31.416" stroke-dashoffset="31.416">
                            <animate attributeName="stroke-dasharray" dur="2s" values="0 31.416;15.708 15.708;0 31.416;0 31.416" repeatCount="indefinite"/>
                            <animate attributeName="stroke-dashoffset" dur="2s" values="0;-15.708;-31.416;-31.416" repeatCount="indefinite"/>
                        </circle>
                    </svg>
                </div>
                <h3>Loading Product...</h3>
                <p class="success-subtitle">Please wait</p>
            </div>
        </div>
    </div>

    <script>
        let currentToken = null;
        const productId = new URLSearchParams(window.location.search).get('id');

        if (!productId) {
            alert("Product ID is required.");
            window.location.href = "/products";
        }

        const tokenForm = document.getElementById("tokenForm");
        const tokenInput = document.getElementById("adminToken");
        const tokenError = document.getElementById("tokenError");
        const updateProductForm = document.getElementById("updateProductForm");
        const titleError = document.getElementById("titleError");
        const priceError = document.getElementById("priceError");
        const stockError = document.getElementById("stockError");
        const successMessage = document.getElementById("successMessage");
        const forbiddenMessage = document.getElementById("forbiddenMessage");
        const loadingMessage = document.getElementById("loadingMessage");

        // Auto-fill token from sessionStorage if available
        const savedToken = sessionStorage.getItem('adminToken');
        if (savedToken) {
            tokenInput.value = savedToken;
            // Auto-verify token
            const token = savedToken.trim();
            if (token) {
                verifyTokenAndLoadProduct(token);
            }
        }

        async function verifyTokenAndLoadProduct(token) {
            tokenError.textContent = "";
            tokenError.classList.remove("show");
            forbiddenMessage.style.display = "none";

            const btn = tokenForm.querySelector(".neu-button");
            btn.classList.add("loading");

            try {
                const res = await fetch("/api/admin/verify", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ token: token })
                });
                const data = await res.json();

                if (res.ok && data.is_admin) {
                    currentToken = token;
                    tokenForm.style.display = "none";
                    await loadProduct();
                } else {
                    forbiddenMessage.style.display = "block";
                    setTimeout(() => {
                        window.location.href = "/shop";
                    }, 2000);
                }
            } catch (err) {
                console.error(err);
                tokenError.textContent = "Network error. Try again.";
                tokenError.classList.add("show");
            } finally {
                btn.classList.remove("loading");
            }
        }

        async function loadProduct() {
            if (!currentToken || !productId) return;

            loadingMessage.style.display = "block";
            updateProductForm.style.display = "none";

            try {
                const res = await fetch(`/api/admin/products/${productId}`, {
                    headers: {
                        "Authorization": "Bearer " + currentToken
                    }
                });
                const data = await res.json();

                loadingMessage.style.display = "none";

                if (!res.ok) {
                    alert(data.error || "Failed to load product.");
                    window.location.href = "/products";
                    return;
                }

                // Pre-fill the form with product data
                updateProductForm.title.value = data.Title || data.title || "";
                updateProductForm.price.value = data.Price ?? data.price ?? 0;
                updateProductForm.stock.value = data.Stock ?? data.stock ?? 0;
                updateProductForm.style.display = "block";
            } catch (err) {
                console.error(err);
                loadingMessage.style.display = "none";
                alert("Network error. Please try again.");
            }
        }

        tokenForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            tokenError.textContent = "";
            tokenError.classList.remove("show");
            forbiddenMessage.style.display = "none";

            const btn = tokenForm.querySelector(".neu-button");
            btn.classList.add("loading");

            const token = tokenInput.value.trim();
            if (!token) {
                tokenError.textContent = "Token is required.";
                tokenError.classList.add("show");
                btn.classList.remove("loading");
                return;
            }

            try {
                const res = await fetch("/api/admin/verify", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ token: token })
                });
                const data = await res.json();

                if (res.ok && data.is_admin) {
                    currentToken = token;
                    sessionStorage.setItem('adminToken', token);
                    tokenForm.style.display = "none";
                    await loadProduct();
                } else {
                    forbiddenMessage.style.display = "block";
                    setTimeout(() => {
                        window.location.href = "/shop";
                    }, 2000);
                }
            } catch (err) {
                console.error(err);
                tokenError.textContent = "Network error. Try again.";
                tokenError.classList.add("show");
            } finally {
                btn.classList.remove("loading");
            }
        });

        updateProductForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            titleError.textContent = "";
            priceError.textContent = "";
            stockError.textContent = "";
            successMessage.style.display = "none";

            const payload = {
                title: updateProductForm.title.value.trim(),
                price: parseFloat(updateProductForm.price.value),
                stock: parseInt(updateProductForm.stock.value, 10)
            };

            const submitButton = updateProductForm.querySelector(".neu-button");
            submitButton.classList.add("loading");

            try {
                const res = await fetch(`/api/admin/products/${productId}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + currentToken
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!res.ok) {
                    const msg = (data.error || "").toLowerCase();
                    if (msg.includes("title")) {
                        titleError.textContent = data.error;
                    } else if (msg.includes("price")) {
                        priceError.textContent = data.error;
                    } else if (msg.includes("stock")) {
                        stockError.textContent = data.error;
                    } else {
                        titleError.textContent = data.error || "Something went wrong.";
                    }
                    return;
                }

                successMessage.style.display = "block";
                setTimeout(() => {
                    window.location.href = "/products";
                }, 800);
            } catch (err) {
                console.error(err);
                titleError.textContent = "Something went wrong. Try again.";
            } finally {
                submitButton.classList.remove("loading");
            }
        });
    </script>
</body>
</html>
